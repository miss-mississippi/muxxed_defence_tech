<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satellite Object Identification</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e;
    --accent: #2f81f7; --ok: #3fb950; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 370px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 0 2px; }
  section { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  section h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .grow { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: 0; }
  .muted { color: var(--muted); }
  button, select, input[type=file] { font: inherit; color: var(--text); }
  button { background: #21262d; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  select { background: #0d1117; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  ul { list-style: none; margin: 0; padding: 0; }
  #upload { display: flex; gap: 8px; align-items: center; }
  #upload input { flex: 1; min-width: 0; }
  #scenes { max-height: 150px; overflow-y: auto; }
  #scenes li { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  #scenes li:hover, #scenes li.sel { background: #1f2630; }
  #scenes li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #scenes li .muted { grid-column: 1 / -1; font-size: 12px; }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .badge.done { color: var(--ok); border-color: #2ea04366; }
  .badge.failed { color: var(--bad); border-color: #f8514966; }
  .badge.processing, .badge.queued { color: var(--warn); border-color: #d2992266; }
  #classes { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; user-select: none; }
  .chip input { display: none; }
  .chip.off { opacity: .4; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .filters { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
  .links { margin-top: 8px; display: flex; gap: 12px; }
  a { color: var(--accent); text-decoration: none; }
  a[aria-disabled=true] { color: var(--muted); pointer-events: none; }
  .hint { font-size: 12px; margin: -4px 0 6px; }
  #detections { overflow-y: auto; flex: 1; }
  .det { display: grid; grid-template-columns: 10px 1fr 40px 48px auto auto; gap: 8px; align-items: center; padding: 3px 6px; border-radius: 5px; cursor: pointer; }
  .det:hover { background: #1f2630; }
  .det.sel { background: #1f3a5f; }
  .det.confirmed .name { color: var(--ok); }
  .det.rejected { opacity: .5; }
  .det.rejected .name { text-decoration: line-through; }
  .det .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .det .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .det button { padding: 0 7px; line-height: 20px; }
  .det button.ok:hover { border-color: var(--ok); color: var(--ok); }
  .det button.no:hover { border-color: var(--bad); color: var(--bad); }
  #map { height: 100%; background: #0b0f14; }
  .leaflet-popup-content { font: 13px/1.45 system-ui, sans-serif; margin: 10px 12px; }
  .pop .row { display: flex; gap: 6px; margin-top: 8px; }
  .pop select, .pop button { color: #111; background: #fff; border-color: #bbb; }
  #toast { position: fixed; right: 16px; bottom: 16px; background: #3b1d1d; border: 1px solid var(--bad); padding: 8px 12px; border-radius: 6px; z-index: 1000; }
  .recall-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #miss-mode.on { background: var(--bad); border-color: var(--bad); }
  #recall { margin-top: 6px; font-size: 12px; }
  .leaflet-container.miss-mode { cursor: crosshair; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>Satellite Object Identification</h1>
      <div class="muted" id="model">connecting to the API…</div>
    </header>
    <section>
      <h2>Upload an image</h2>
      <form id="upload">
        <input type="file" id="file" accept=".tif,.tiff,.jpg,.jpeg,.png">
        <button class="primary" id="upload-btn">Process</button>
      </form>
    </section>
    <section>
      <h2>Scenes</h2>
      <ul id="scenes"><li class="muted">loading…</li></ul>
    </section>
    <section>
      <h2>Filters</h2>
      <div id="classes"></div>
      <div class="filters">
        <label for="conf">Confidence ≥ <span id="conf-val">0.40</span></label>
        <input type="range" id="conf" min="0" max="1" step="0.05" value="0.4">
        <label for="status">Status</label>
        <select id="status">
          <option value="">all</option>
          <option value="pending">not reviewed</option>
          <option value="confirmed">confirmed</option>
          <option value="rejected">rejected</option>
        </select>
        <label for="geom">Size check</label>
        <select id="geom">
          <option value="">all</option>
          <option value="mismatch">type not confirmed</option>
          <option value="borderline">borderline</option>
          <option value="ok">size matches</option>
          <option value="unknown">not checked</option>
        </select>
      </div>
      <div class="links">
        <a id="report" target="_blank" aria-disabled="true">Report</a>
        <a id="geojson" target="_blank" aria-disabled="true">GeoJSON</a>
        <a href="/docs" target="_blank">API</a>
      </div>
    </section>
    <section>
      <h2>Recall</h2>
      <div class="recall-row">
        <button id="miss-mode" disabled>Mark missed objects</button>
        <label class="muted"><input type="checkbox" id="complete" disabled> all misses marked</label>
      </div>
      <div id="recall" class="muted">open a scene</div>
    </section>
    <section class="grow">
      <h2>Detections <span id="count" class="muted"></span></h2>
      <div class="hint muted">↑ ↓ select · C confirm · R reject</div>
      <ul id="detections"></ul>
    </section>
  </aside>
  <main id="map"></main>
</div>
<div id="toast" hidden></div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script>
// same palette as ultralytics, so colours match the images rendered by scripts/
const PALETTE = ["042AFF","0BDBEB","F3F3F3","00DFB7","111F68","FF6FDD","FF444F","CCED00","00F344","BD00FF",
                 "00B4FF","DD00BA","00FFFF","26C000","01FFB3","7D24FF","7B0068","FF1B6C","FC6D2F","A2FF0B"].map(h => "#" + h);
const STATUS_TEXT = { pending: "not reviewed", confirmed: "confirmed", rejected: "rejected" };
const KZ_VIEW = [[48.0, 67.0], 5];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const state = { model: null, classIds: {}, scene: null, features: [], visibleIds: [], selected: null,
                hidden: new Set(), map: null, layer: null, shapes: new Map(), pendingOpen: null,
                missed: [], missLayer: null, missMode: false };

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : r.statusText);
  return body;
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.hidden = true), 4000);
}

const className = p => p.review_class || p.class_name;
const colorOf = name => PALETTE[(state.classIds[name] ?? 0) % PALETTE.length];

// ---------- map ----------

function makeMap(georef) {
  if (state.map) state.map.remove();
  state.shapes.clear();
  state.layer = null;
  const map = L.map("map", georef ? { maxZoom: 22 } : { crs: L.CRS.Simple, minZoom: -6, maxZoom: 4 });
  if (georef) {
    const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 22, maxNativeZoom: 17, attribution: "Basemap © Esri World Imagery" });  // Esri has placeholder tiles above z17 in places
    const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      { maxZoom: 22, maxNativeZoom: 19, attribution: "© OpenStreetMap" });
    esri.addTo(map);
    // basemaps come from the internet; on an isolated network choose "no basemap"
    const blank = L.layerGroup();
    L.control.layers(
      { "Satellite (Esri)": esri, "OpenStreetMap": osm, "No basemap (offline)": blank },
      {}, { position: "topright" },
    ).addTo(map);
    map.setView(...KZ_VIEW);
  }
  L.control.scale({ imperial: false }).addTo(map);
  map.on("click", onMapClick);
  state.map = map;
  state.missLayer = null;
}

function latlngs(f) {
  if (state.scene.georeferenced) return f.geometry.coordinates[0].slice(0, -1).map(([lon, lat]) => [lat, lon]);
  return f.properties.polygon_px.map(([x, y]) => [-y, x]);  // CRS.Simple: y points up
}

function styleOf(p, selected) {
  const c = colorOf(className(p));
  const byStatus = {
    pending:   { weight: 2, dashArray: "5 4", fillOpacity: 0.06 },
    confirmed: { weight: 2.5, fillOpacity: 0.25 },
    rejected:  { weight: 1, color: "#8b949e", opacity: 0.5, fillOpacity: 0 },
  }[p.review_status];
  const style = { color: c, fillColor: c, opacity: 0.95, dashArray: null, ...byStatus };
  return selected ? { ...style, color: "#ffffff", weight: 4, dashArray: null, opacity: 1 } : style;
}

// ---------- scenes ----------

function sceneStatus(s) {
  if (s.status === "processing") return `processing ${Math.round(s.progress * 100)}%`;
  return { queued: "queued", done: "done", failed: "failed" }[s.status] || s.status;
}

async function loadScenes() {
  let scenes;
  try { scenes = await api("/api/scenes"); } catch (e) { toast(e.message); return; }
  $("scenes").innerHTML = scenes.map(s => {
    const total = Object.values(s.review || {}).reduce((a, b) => a + b, 0);
    const checked = (s.review?.confirmed || 0) + (s.review?.rejected || 0);
    const info = s.status === "done" ? `${total} objects · ${checked} reviewed` : s.status === "failed" ? esc(s.error || "") : "";
    return `<li data-id="${s.id}" class="${state.scene?.id === s.id ? "sel" : ""}">
      <span class="name">${esc(s.filename)}</span><span class="badge ${s.status}">${sceneStatus(s)}</span>
      ${info ? `<span class="muted">${info}</span>` : ""}</li>`;
  }).join("") || `<li class="muted">nothing yet: upload an image</li>`;

  if (state.pendingOpen) {
    const s = scenes.find(x => x.id === state.pendingOpen);
    if (s?.status === "done") { state.pendingOpen = null; openScene(s.id); }
    if (s?.status === "failed") { state.pendingOpen = null; toast(`Processing failed: ${s.error}`); }
  }
  if (scenes.some(s => s.status === "queued" || s.status === "processing")) setTimeout(loadScenes, 1500);
}

async function openScene(id) {
  const scene = await api(`/api/scenes/${id}`);
  if (scene.status !== "done") { state.pendingOpen = id; loadScenes(); return; }
  state.scene = scene;
  state.selected = null;
  state.hidden.clear();
  makeMap(scene.georeferenced);
  const bounds = scene.georeferenced ? scene.preview_bounds : [[-scene.height, 0], [0, scene.width]];
  L.imageOverlay(`/api/scenes/${id}/preview.png`, bounds).addTo(state.map);
  state.map.fitBounds(bounds);
  state.features = (await api(`/api/detections?scene_id=${id}`)).features;
  ["report", "geojson"].forEach(a => $(a).setAttribute("aria-disabled", "false"));
  (scene.warnings || []).forEach(toast);
  loadScenes();
  render();
  setMissMode(false);
  ["miss-mode", "complete"].forEach(b => ($(b).disabled = false));
  loadMissed().catch(e => toast(e.message));
}

// ---------- detections ----------

function visibleFeatures() {
  const minConf = +$("conf").value, status = $("status").value, geom = $("geom").value;
  return state.features.filter(({ properties: p }) =>
    p.confidence >= minConf && (!status || p.review_status === status)
    && (!geom || (p.size_check || "unknown") === geom) && !state.hidden.has(className(p)));
}

function renderClasses() {
  const counts = {};
  for (const { properties: p } of state.features) counts[className(p)] = (counts[className(p)] || 0) + 1;
  $("classes").innerHTML = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([name, n]) =>
    `<label class="chip ${state.hidden.has(name) ? "off" : ""}"><input type="checkbox" data-class="${esc(name)}">
     <span class="dot" style="background:${colorOf(name)}"></span>${esc(name)} <span class="muted">${n}</span></label>`).join("");
}

function render() {
  if (!state.scene) return;
  const minConf = $("conf").value;  // the report and GeoJSON use the same threshold as the map
  $("report").href = `/api/scenes/${state.scene.id}/report?min_conf=${minConf}`;
  $("geojson").href = `/api/detections?scene_id=${state.scene.id}&min_conf=${minConf}`;
  renderClasses();
  const list = visibleFeatures();
  state.visibleIds = list.map(f => f.id);
  $("count").textContent = `${list.length} of ${state.features.length}`;

  if (state.layer) state.layer.remove();
  state.layer = L.layerGroup().addTo(state.map);
  state.shapes.clear();
  for (const f of list) {
    // a click on an object must not reach the map, where it would mean "mark a miss"
    const shape = L.polygon(latlngs(f), { ...styleOf(f.properties, f.id === state.selected), bubblingMouseEvents: false })
      .addTo(state.layer);
    shape.on("click", () => select(f.id, false));
    state.shapes.set(f.id, shape);
  }

  $("detections").innerHTML = list.map(({ id, properties: p }) => `
    <li class="det ${p.review_status} ${id === state.selected ? "sel" : ""}" data-id="${id}">
      <span class="dot" style="background:${colorOf(className(p))}"></span>
      <span class="name">${esc(className(p))}${p.size_check === "mismatch" ? ` <span title="type not confirmed by size">⚠</span>` : p.size_check === "borderline" ? ` <span title="borderline size">≈</span>` : ""}</span>
      <span class="num">${p.confidence.toFixed(2)}</span>
      <span class="num">${p.length_m != null ? p.length_m.toFixed(0) + " m" : ""}</span>
      <button class="ok" data-act="confirmed" title="Confirm (C)">✓</button>
      <button class="no" data-act="rejected" title="Reject (R)">✗</button>
    </li>`).join("");
}

function popupHtml(f) {
  const p = f.properties;
  const where = p.center_lat != null
    ? `${p.center_lat.toFixed(6)}, ${p.center_lon.toFixed(6)}<br>${p.length_m.toFixed(1)} × ${p.width_m.toFixed(1)} m · azimuth ${p.orientation_deg.toFixed(0)}°`
    : `pixels: ${p.cx.toFixed(0)}, ${p.cy.toFixed(0)} · ${p.w.toFixed(0)} × ${p.h.toFixed(0)} px`;
  const options = Object.keys(state.classIds).map(n => `<option ${n === className(p) ? "selected" : ""}>${esc(n)}</option>`).join("");
  const dev = p.size_deviation != null ? ` · ${(p.size_deviation * 100).toFixed(1)}% off the reference` : "";
  const geom = p.size_check === "mismatch"
    ? `<br><b style="color:#b00">⚠ type not confirmed by size</b>${dev}`
    : p.size_check === "borderline" ? `<br><b style="color:#b26a00">≈ borderline size</b>${dev}`
    : p.size_check === "ok" ? `<br><span class="muted">size matches the type</span>` : "";
  return `<div class="pop"><b>${esc(className(p))}</b> · ${p.confidence.toFixed(2)} · #${f.id}<br>${where}${geom}<br>
    Model: ${esc(p.model || "—")}<br>
    Status: ${STATUS_TEXT[p.review_status]}${p.review_class ? ` (model said: ${esc(p.class_name)})` : ""}
    <div class="row"><select id="fix-class">${options}</select></div>
    <div class="row"><button onclick="review(${f.id}, 'confirmed')">✓ Confirm</button>
    <button onclick="review(${f.id}, 'rejected')">✗ Reject</button></div></div>`;
}

function select(id, pan) {
  const prev = state.selected;
  state.selected = id;
  const f = state.features.find(x => x.id === id);
  if (prev != null && state.shapes.has(prev)) {
    const pf = state.features.find(x => x.id === prev);
    state.shapes.get(prev).setStyle(styleOf(pf.properties, false));
  }
  document.querySelectorAll(".det.sel").forEach(el => el.classList.remove("sel"));
  const row = document.querySelector(`.det[data-id="${id}"]`);
  if (row) { row.classList.add("sel"); row.scrollIntoView({ block: "nearest" }); }
  const shape = state.shapes.get(id);
  if (!f || !shape) return;
  shape.setStyle(styleOf(f.properties, true)).bringToFront();
  if (pan) state.map.fitBounds(shape.getBounds(), { maxZoom: state.scene.georeferenced ? 19 : 1, padding: [120, 120] });
  shape.bindPopup(popupHtml(f), { autoPan: !pan }).openPopup();
}

async function review(id, status) {
  const f = state.features.find(x => x.id === id);
  const picker = $("fix-class");
  const chosen = picker && state.selected === id ? picker.value : className(f.properties);
  const body = { status, class_name: chosen !== f.properties.class_name ? chosen : null };
  try {
    const updated = await api(`/api/detections/${id}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const order = state.visibleIds, next = order[order.indexOf(id) + 1];
    state.features[state.features.indexOf(f)] = updated;
    state.map.closePopup();
    render();
    loadScenes();
    const target = next ?? state.visibleIds[state.visibleIds.length - 1];
    if (target != null) select(target, true);
  } catch (e) { toast(e.message); }
}
window.review = review;

// ---------- recall ----------

function missedLatLng(f) {
  const p = f.properties;
  return state.scene.georeferenced ? [p.center_lat, p.center_lon] : [-p.cy, p.cx];
}

function renderMissed() {
  if (state.missLayer) state.missLayer.remove();
  state.missLayer = L.layerGroup().addTo(state.map);
  for (const f of state.missed) {
    L.circleMarker(missedLatLng(f), { radius: 9, color: "#f85149", weight: 2, dashArray: "3 3",
                                      fillOpacity: 0.1, bubblingMouseEvents: false })
      .bindPopup(`<div class="pop"><b>Missed: ${esc(f.properties.class_name)}</b> · #${f.id}<br>
        the model did not find this object
        <div class="row"><button onclick="removeMissed(${f.id})">Remove mark</button></div></div>`)
      .addTo(state.missLayer);
  }
}

async function loadRecall() {
  const r = await api(`/api/scenes/${state.scene.id}/recall`);
  $("complete").checked = r.complete;
  const t = r.total;
  if (!t.exist) { $("recall").textContent = "no confirmed objects yet"; return; }
  const pct = v => (v == null ? "—" : `${Math.round(v * 100)}%`);
  const label = r.complete ? "Recall" : "Recall upper bound (not all misses marked)";
  $("recall").innerHTML = `${label}: <b>${pct(t.recall["0.25"])}</b> at ≥ 0.25 · ` +
    `<b>${pct(t.recall["0.4"])}</b> at ≥ 0.4<br>${t.exist} exist, ${t.missed} of them missed`;
}

async function loadMissed() {
  state.missed = (await api(`/api/scenes/${state.scene.id}/missed`)).features;
  renderMissed();
  await loadRecall();
}

function setMissMode(on) {
  state.missMode = on;
  $("miss-mode").classList.toggle("on", on);
  $("miss-mode").textContent = on ? "Done" : "Mark missed objects";
  state.map.getContainer().classList.toggle("miss-mode", on);
  if (on) {
    // a miss is an object absent from the catalogue altogether, so show the whole catalogue
    $("conf").value = 0.25;
    $("conf-val").textContent = "0.25";
    render();
    toast("Click an object the model missed. The threshold is lowered to 0.25 so the whole catalogue is visible.");
  }
}

function onMapClick(e) {
  if (!state.missMode || !state.scene) return;
  const options = Object.keys(state.classIds).map(n => `<option>${esc(n)}</option>`).join("");
  L.popup().setLatLng(e.latlng).setContent(`<div class="pop"><b>Missed object</b>
    <div class="row"><select id="miss-class">${options}</select></div>
    <div class="row"><button onclick="addMissed(${e.latlng.lat}, ${e.latlng.lng})">Add</button></div></div>`)
    .openOn(state.map);
}

async function addMissed(lat, lng) {
  const cls = $("miss-class").value;
  const body = state.scene.georeferenced ? { class_name: cls, lon: lng, lat } : { class_name: cls, cx: lng, cy: -lat };
  try {
    await api(`/api/scenes/${state.scene.id}/missed`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    state.map.closePopup();
    await loadMissed();
  } catch (err) { toast(err.message); }
}
window.addMissed = addMissed;

async function removeMissed(id) {
  try {
    await api(`/api/missed/${id}`, { method: "DELETE" });
    state.map.closePopup();
    await loadMissed();
  } catch (err) { toast(err.message); }
}
window.removeMissed = removeMissed;

// ---------- events ----------

$("upload").addEventListener("submit", async e => {
  e.preventDefault();
  const file = $("file").files[0];
  if (!file) return toast("Choose an image file");
  const form = new FormData();
  form.append("file", file);
  $("upload-btn").disabled = true;
  try {
    const scene = await api("/api/scenes", { method: "POST", body: form });
    state.pendingOpen = scene.id;
    $("file").value = "";
    loadScenes();
  } catch (err) { toast(err.message); }
  finally { $("upload-btn").disabled = false; }
});

$("scenes").addEventListener("click", e => {
  const li = e.target.closest("li[data-id]");
  if (li) openScene(+li.dataset.id).catch(err => toast(err.message));
});

$("classes").addEventListener("change", e => {
  const name = e.target.dataset.class;
  state.hidden.has(name) ? state.hidden.delete(name) : state.hidden.add(name);
  render();
});

$("conf").addEventListener("input", () => { $("conf-val").textContent = (+$("conf").value).toFixed(2); render(); });
$("status").addEventListener("change", render);
$("geom").addEventListener("change", render);
$("miss-mode").addEventListener("click", () => setMissMode(!state.missMode));
$("complete").addEventListener("change", async e => {
  try {
    await api(`/api/scenes/${state.scene.id}/completeness`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ complete: e.target.checked }) });
    await loadRecall();
  } catch (err) { toast(err.message); e.target.checked = !e.target.checked; }
});

$("detections").addEventListener("click", e => {
  const li = e.target.closest(".det");
  if (!li) return;
  const act = e.target.dataset.act;
  act ? review(+li.dataset.id, act) : select(+li.dataset.id, true);
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea") || !state.visibleIds.length) return;
  const ids = state.visibleIds, i = ids.indexOf(state.selected);
  if (e.key === "ArrowDown") { e.preventDefault(); select(ids[Math.min(i + 1, ids.length - 1)], true); }
  else if (e.key === "ArrowUp") { e.preventDefault(); select(ids[Math.max(i - 1, 0)], true); }
  else if (state.selected == null) return;
  // code is layout-independent; key is a fallback (с/к are the same physical keys in the Russian layout)
  else if (e.code === "KeyC" || "cCсС".includes(e.key)) review(state.selected, "confirmed");
  else if (e.code === "KeyR" || "rRкК".includes(e.key)) review(state.selected, "rejected");
});

// ---------- start ----------

(async () => {
  makeMap(true);
  try {
    state.model = await api("/api/model");
    state.classIds = {};
    for (const m of state.model.models) {
      for (const [id, name] of Object.entries(m.classes)) if (!(name in state.classIds)) state.classIds[name] = +id;
    }
    const names = state.model.models.map(m => m.name).join(" + ");
    $("model").textContent = `${names} · ${state.model.device} · ${Object.keys(state.classIds).length} classes`;
  } catch (e) { $("model").textContent = "API unavailable"; toast(e.message); }
  loadScenes();
})();
</script>
</body>
</html>
